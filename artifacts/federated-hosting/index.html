<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Federated Hosting</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Node region — used by i18n to default to Bahasa for Indonesian nodes.
         The TypeScript server replaces this placeholder at runtime via the
         /api/health endpoint, or operators can set it at build time.
         Format: AWS-style region e.g. ap-southeast-3 (Jakarta), us-east-1 -->
    <meta name="fh-node-region" content="%VITE_NODE_REGION%" />
    <!-- No font <link> here on purpose. Inter used to be fetched from Google
         at this point; nothing in the design system referenced it (--font-sans
         is Manrope), so it was a request to a third party for a font that was
         never used. The real faces are self-hosted via @fontsource in
         src/index.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
